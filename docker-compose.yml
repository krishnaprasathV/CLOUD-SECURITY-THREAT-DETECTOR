version: '3.8'

services:
  threat-detector:
    build: .
    container_name: wipro-cloud-threat-detector
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
      - AWS_OFFLINE_MODE=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
